name: Deploy Tempo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tempo.yaml
      - services/tempo.yaml
      - services/tempo/**
      - scripts/prepare-tempo-env.py
  workflow_dispatch:
    inputs:
      tag:
        description: Tempo image version/channel (use a version to pin both images)
        required: true
        default: stable
        type: string
      dry_run:
        description: Validate without changing running services
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, beelink]
    environment: mouras-home-lab
    concurrency:
      group: home-lab-beelink
      cancel-in-progress: false
    env:
      COMPOSE_FILE: services/compose.yaml
      TIME_ZONE: ${{ vars.TIME_ZONE || 'Europe/Lisbon' }}
      TEMPO_TAG: ${{ inputs.tag || 'stable' }}
      TEMPO_PORTAL_URL: ${{ vars.TEMPO_PORTAL_URL || 'https://tempo.mouras.me' }}
      TEMPO_IDENTITY_URL: ${{ vars.TEMPO_IDENTITY_URL || 'https://keycloak.mouras.me' }}
      TEMPO_POSTGRES_PASSWORD: ${{ secrets.TEMPO_POSTGRES_PASSWORD }}
      TEMPO_APP_DB_PASSWORD: ${{ secrets.TEMPO_APP_DB_PASSWORD }}
      TEMPO_IDENTITY_DB_PASSWORD: ${{ secrets.TEMPO_IDENTITY_DB_PASSWORD }}
      TEMPO_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.TEMPO_KEYCLOAK_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image tag
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}",os.environ["TEMPO_TAG"]), "Invalid image tag"'
      - name: Prepare persistent Tempo credentials
        run: python3 scripts/prepare-tempo-env.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Log in to private Tempo packages
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER || github.actor }}
          password: ${{ secrets.GH_PAT }}
      - name: Pull Tempo images
        if: ${{ !inputs.dry_run }}
        run: docker compose pull tempo-postgres tempo-keycloak tempo-migrate tempo-api tempo-portal
      - name: Install or update Tempo
        if: ${{ !inputs.dry_run }}
        run: docker compose up -d --wait --wait-timeout 360 tempo-portal
