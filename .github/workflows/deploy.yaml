name: Deploy Home Lab
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Install/update or uninstall selected services"
        required: true
        type: choice
        options:
          - install
          - uninstall
      services:
        description: "Service names separated by commas/spaces, or all (see docs/services.md)"
        required: true
        type: string
      dry_run:
        required: true
        description: "Validate only, without changing running services"
        type: boolean
        default: false
      host:
        description: "Select the host runner"
        required: true
        type: choice
        options:
          - rpi
          - beelink
      environment:
        description: "GitHub environment"
        required: true
        type: choice
        options:
          - mouras-home-lab
        default: mouras-home-lab
      bring_down_first:
        description: "Stop selected services and dependencies before installing"
        required: true
        type: boolean
        default: false
      update_images:
        description: "Pull remote image updates before deployment"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: home-lab-${{ inputs.host }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to ${{ inputs.host }}
    runs-on: ${{ inputs.host }}
    environment: ${{ inputs.environment || 'mouras-home-lab' }}
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: services/compose.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env file from selected environment
        env:
          ENVIRONMENT_VARS: ${{ toJson(vars) }}
          ENVIRONMENT_SECRETS: ${{ toJson(secrets) }}
        run: bash scripts/workflow.step.create-environment-file.sh

      - name: Validate Compose configuration and published ports
        run: |
          bash scripts/test-validate-compose.sh
          docker compose --env-file .env config --format json | bash scripts/validate-compose.sh

      - name: Manage selected services and dependencies
        env:
          SERVICE_ACTION: ${{ inputs.action }}
          SELECTED_SERVICES: ${{ inputs.services }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPDATE_IMAGES: ${{ inputs.update_images }}
          BRING_DOWN_FIRST: ${{ inputs.bring_down_first }}
        run: bash scripts/workflow.step.manage-services.sh

      - name: Remove generated environment file
        if: ${{ always() }}
        run: rm -f .env
