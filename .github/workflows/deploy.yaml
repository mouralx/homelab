name: Deploy Home Lab
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Install/update or uninstall selected profiles"
        required: true
        type: choice
        options:
          - install
          - uninstall
      ai:
        description: "AI — Hermes, Honcho, LM Studio, Postgres, Keycloak, pgAdmin, Portainer Agent"
        type: boolean
        default: false
      media:
        description: "Media — Jellyfin, Sonarr, Radarr, Prowlarr, Transmission, Portainer Agent"
        type: boolean
        default: false
      management:
        description: "Management — Nginx Proxy Manager and Portainer"
        type: boolean
        default: false
      dry_run:
        required: true
        description: "Validate only, without changing running services"
        type: boolean
        default: false
      environment:
        description: "GitHub environment"
        required: true
        type: choice
        options:
          - mouras-home-lab
        default: mouras-home-lab
      bring_down_first:
        description: "Stop each selected profile before installing"
        required: true
        type: boolean
        default: false
      update_images:
        description: "Pull remote image updates before installation"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    name: Select profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve profile checkboxes
        id: profiles
        env:
          WORKFLOW_INPUTS: ${{ toJson(inputs) }}
        run: |
          matrix=$(bash scripts/workflow.step.select-profiles.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Test workflow scripts
        run: |
          bash scripts/test-select-profiles.sh
          bash scripts/test-manage-services.sh
          bash scripts/test-validate-compose.sh
  deploy:
    name: ${{ inputs.action }} ${{ matrix.profile }} on ${{ matrix.host }}
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    runs-on: [self-hosted, "${{ matrix.host }}"]
    concurrency:
      group: home-lab-${{ matrix.host }}
      cancel-in-progress: false
    environment: ${{ inputs.environment || 'mouras-home-lab' }}
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: services/compose.yaml
      SELECTED_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create .env file from selected environment
        env:
          ENVIRONMENT_VARS: ${{ toJson(vars) }}
          ENVIRONMENT_SECRETS: ${{ toJson(secrets) }}
        run: bash scripts/workflow.step.create-environment-file.sh
      - name: Manage profile services and dependencies
        env:
          SERVICE_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPDATE_IMAGES: ${{ inputs.update_images }}
          BRING_DOWN_FIRST: ${{ inputs.bring_down_first }}
        run: bash scripts/workflow.step.manage-services.sh
      - name: Remove generated environment file
        if: ${{ always() }}
        run: rm -f .env
