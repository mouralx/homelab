name: Deploy Home Lab

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the stack without starting containers?"
        required: true
        type: boolean
        default: true
      host:
        description: "Select the host runner"
        required: true
        type: choice
        options:
          - rpi
          - beelink
      environment:
        description: "GitHub environment"
        required: true
        type: choice
        options:
          - mouras-home-lab
        default: mouras-home-lab
      bring_down_first:
        description: "Stop the current stacks before deploying."
        required: true
        type: boolean
        default: false
      update_images:
        description: "Pull remote image updates before deployment."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'mouras-home-lab' }}
    runs-on: ${{ inputs.host }}
    environment: ${{ inputs.environment || 'mouras-home-lab' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env file from selected environment
        env:
          ENVIRONMENT_VARS: ${{ toJson(vars) }}
          ENVIRONMENT_SECRETS: ${{ toJson(secrets) }}
        run: bash scripts/workflow.step.create-environment-file.sh

      - name: Validate compose files
        run: |
          docker compose --env-file .env -f services/compose.agentic.yaml config >/dev/null
          docker compose --env-file .env -f services/compose.media.yaml config >/dev/null
          docker compose --env-file .env -f services/compose.tools.yaml config >/dev/null

      - name: Stop current stacks
        if: ${{ inputs.bring_down_first == true }}
        run: |
          docker compose --env-file .env -f services/compose.agentic.yaml down --remove-orphans || true
          docker compose --env-file .env -f services/compose.media.yaml down --remove-orphans || true
          docker compose --env-file .env -f services/compose.tools.yaml down --remove-orphans || true

      - name: Pull updated images
        if: ${{ inputs.bring_down_first == true && inputs.update_images == true }}
        run: |
          docker compose --env-file .env -f services/compose.agentic.yaml pull || true
          docker compose --env-file .env -f services/compose.media.yaml pull || true
          docker compose --env-file .env -f services/compose.tools.yaml pull || true

      - name: Build agentic stack
        run: docker compose --env-file .env -f services/compose.agentic.yaml build

      - name: Build media stack
        run: docker compose --env-file .env -f services/compose.media.yaml build

      - name: Deploy agentic stack
        if: ${{ inputs.dry_run == false }}
        run: docker compose --env-file .env -f services/compose.agentic.yaml up -d

      - name: Deploy media stack
        if: ${{ inputs.dry_run == false }}
        run: docker compose --env-file .env -f services/compose.media.yaml up -d
      
      - name: Deploy tools stack
        if: ${{ inputs.dry_run == false }}
        run: docker compose --env-file .env -f services/compose.tools.yaml up -d

      - name: Clean up dangling Docker images
        run: bash scripts/workflow.step.clean-docker.sh