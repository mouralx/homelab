name: Deploy Home Lab
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Install/update or uninstall the full stack"
        required: true
        type: choice
        options:
          - install
          - uninstall
      dry_run:
        required: true
        description: "Validate only, without changing running services"
        type: boolean
        default: false
      environment:
        description: "GitHub environment"
        required: true
        type: choice
        options:
          - mouras-home-lab
        default: mouras-home-lab
      bring_down_first:
        description: "Stop services before installing"
        required: true
        type: boolean
        default: false
      update_images:
        description: "Pull remote image updates before installation"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    name: ${{ inputs.action }} full stack on Beelink
    runs-on: [self-hosted, beelink]
    concurrency:
      group: home-lab-beelink
      cancel-in-progress: false
    environment: ${{ inputs.environment || 'mouras-home-lab' }}
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: services/compose.yaml
      SELECTED_SERVICES: all
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Create .env file from selected environment
        env:
          ENVIRONMENT_VARS: ${{ toJson(vars) }}
          ENVIRONMENT_SECRETS: ${{ toJson(secrets) }}
        run: bash scripts/workflow.step.create-environment-file.sh
      - name: Manage all services and dependencies
        env:
          SERVICE_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          UPDATE_IMAGES: ${{ inputs.update_images }}
          BRING_DOWN_FIRST: ${{ inputs.bring_down_first }}
        run: bash scripts/workflow.step.manage-services.sh
      - name: Remove generated environment file
        if: ${{ always() }}
        run: rm -f .env
