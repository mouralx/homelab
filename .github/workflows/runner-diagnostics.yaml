name: Diagnose Home Lab Runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: [self-hosted, beelink]
    concurrency:
      group: home-lab-beelink
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read sanitized runner logging diagnostics
        run: python3 scripts/workflow.step.diagnose-runner-logs.py
