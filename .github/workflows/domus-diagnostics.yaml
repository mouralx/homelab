name: Diagnose Domus
on:
  workflow_dispatch:
    inputs:
      resolve_account:
        description: Resolve the original local administrator account ID
        type: boolean
        default: false
      email:
        description: Account email to resolve
        type: string
        default: nuno.moura@outlook.com
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: [self-hosted, beelink]
    concurrency:
      group: home-lab-beelink
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve existing local account without exposing credentials
        if: ${{ inputs.resolve_account }}
        env:
          ACCOUNT_EMAIL: ${{ inputs.email }}
        shell: bash
        run: python3 scripts/workflow.step.resolve-domus-account.py
      - name: Read sanitized authentication exceptions
        shell: bash
        run: python3 scripts/workflow.step.read-domus-authentication-exceptions.py
