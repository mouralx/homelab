name: Home Lab Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to:'
        required: true
        type: choice
        options:
          - mouras-home-lab
        default: mouras-home-lab
      stack:
        description: 'Select the stack to deploy:'
        required: true
        type: choice
        options:
          - All
          - AI
          - Core
        default: All
      bring_down_first:
        description: 'Bring down infrastructure down.'
        required: true
        type: boolean
        default: false
      update_images:
        description: 'Update Docker images before deployment.'
        required: true
        type: boolean
        default: false
jobs:
  deploy:
    name: "Deploy to: ${{ inputs.environment }}"
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:

      # Check out the repository to access the .env file and deployment scripts
      - name: Checking out repository
        uses: actions/checkout@v3

      # Install jq and use it to replace the Transmission username and password in the appsettings.json file with the values from the selected environment's variables and secrets
      - name: Redacting configurations
        env:
          TRANSMISSION_USERNAME: ${{ vars.TRANSMISSION_USERNAME }}
          TRANSMISSION_PASSWORD: ${{ secrets.TRANSMISSION_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update
            apt-get install -y jq
          fi
          env \
            "TRANSMISSION_USERNAME=$TRANSMISSION_USERNAME" \
            "TRANSMISSION_PASSWORD=$TRANSMISSION_PASSWORD" \
            bash -lc '
              set -euo pipefail
              : "${TRANSMISSION_USERNAME:?TRANSMISSION_USERNAME variable is required}"
              : "${TRANSMISSION_PASSWORD:?TRANSMISSION_PASSWORD secret is required}"
              appsettings_path="src/Digger/Digger.Worker/appsettings.json"
              appsettings_tmp="$(mktemp)"

              jq \
                --arg transmissionUsername "$TRANSMISSION_USERNAME" \
                --arg transmissionPassword "$TRANSMISSION_PASSWORD" \
                '\''"'\''setpath(["Transmission", "User"]; $transmissionUsername)
                 | setpath(["Transmission", "Password"]; $transmissionPassword)'\''"'\'' \
                "$appsettings_path" > "$appsettings_tmp"
              jq empty "$appsettings_tmp"
              mv "$appsettings_tmp" "$appsettings_path"
            '
      
      # Set up Docker on the runner to enable building and deploying the Docker Compose application
      - name: Set up container runtime
        run: |
            if command -v docker >/dev/null 2>&1; then
              echo "Docker is already installed. Skipping installation."
            else
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              rm get-docker.sh
            fi

      # Create .env file from the variables and secrets attached to the selected GitHub Environment
      - name: Create .env file from selected environment
        env:
          ENVIRONMENT_VARS: ${{ toJson(vars) }}
          ENVIRONMENT_SECRETS: ${{ toJson(secrets) }}
        run: |
          env \
            "ENVIRONMENT_VARS=$ENVIRONMENT_VARS" \
            "ENVIRONMENT_SECRETS=$ENVIRONMENT_SECRETS" \
            bash -lc '
              set -euo pipefail
              jq -r '\''"'\''to_entries[] | select(.key != "GITHUB_TOKEN") | "\(.key)=\(.value | tostring)"'\''"'\'' <<< "$ENVIRONMENT_VARS" > infra/.env
              jq -r '\''"'\''to_entries[] | select(.key != "GITHUB_TOKEN") | "\(.key)=\(.value | tostring)"'\''"'\'' <<< "$ENVIRONMENT_SECRETS" >> infra/.env
              cat infra/.env
            '
      
      # Determine compose profile flags based on the selected stack
      - name: Resolve compose profiles
        id: profiles
        run: |
          case "${{ inputs.stack }}" in
            All)  echo "flags=--profile ai --profile media --profile tools" >> "$GITHUB_OUTPUT" ;;
            AI)   echo "flags=--profile ai" >> "$GITHUB_OUTPUT" ;;
            Core) echo "flags=" >> "$GITHUB_OUTPUT" ;;
          esac

      # Bring down any existing infrastructure
      - name: Bring current infrastructure down
        if: ${{ inputs.bring_down_first }}
        run: docker compose -f infra/compose.yaml down --remove-orphans

      # Pull the latest Docker images for the application if the update_images input is true
      - name: Pull new images
        if: ${{ inputs.bring_down_first && inputs.update_images }}
        run: docker compose -f infra/compose.yaml pull ${{ steps.profiles.outputs.flags }}

      # Build the selected stack
      - name: Build stack
        run: docker compose -f infra/compose.yaml build ${{ steps.profiles.outputs.flags }}

      # Deploy the selected stack
      - name: Deploy stack
        run: docker compose -f infra/compose.yaml ${{ steps.profiles.outputs.flags }} up -d
      
      # Clean up any dangling Docker images to free up disk space on the runner
      - name: Clean docker dangling images
        run: |
          bash -lc '
            set -euo pipefail
            docker system prune -af
          '
