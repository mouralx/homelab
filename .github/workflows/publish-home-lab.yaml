name: Home Lab Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to:'
        required: true
        type: choice
        default: 'mouras-home-lab'
        options:
          - mouras-home-lab
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: Checkout repository
        uses: actions/checkout@v3