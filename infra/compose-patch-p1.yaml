services:
  digger:
    build:
      context: ../src/Digger
      dockerfile: ../../infra/Dockerfile.digger
    container_name: digger
    restart: unless-stopped
    environment:
      Logging__Level__Default: Warning
      Logging__Level__Microsoft: Warning
      Logging__LogLevel__Microsoft_Hosting_Lifetime: Warning
      Logging__LogLevel__Microsoft__EntityFrameworkCore__Database__Command: Warning
    depends_on:
      transmission:
        condition: service_healthy
    volumes:
      - ${DIGGER_HOST_MOVIES_DIR}:/downloads/movies:rw
      - ~/digger:/digger/data:rw
    networks:
      default:
        ipv4_address: 10.51.0.2
  llmster:
    build:
      context: ..
      dockerfile: infra/Dockerfile.llmster
    container_name: llmster
    restart: unless-stopped
    environment:
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-e2b}
    volumes:
      - ~/llmster:/root/.lmstudio/models
    ports:
      - 4321:4321
    networks:
      default:
        ipv4_address: 10.51.0.18
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4321/v1/models || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 120s
  vault:
    container_name: vault
    entrypoint: /vault/config/entrypoint.sh
    image: hashicorp/vault:latest
    restart: unless-stopped
    volumes:
      - ~/vault/config:/vault/config
      - ~/vault/logs:/vault/logs
      - ~/vault/file:/vault/file
    ports:
      - 1234:1234
    networks:
      default:
        ipv4_address: 10.51.0.6
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8200/v1/sys/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway
    ports:
      - 8642:8642
      - 9119:9119
    networks:
      default:
        ipv4_address: 10.51.0.17
    volumes:
      - ~/hermes:/opt/data