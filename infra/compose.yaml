services:
  deepwiki:
    container_name: deepwiki
    image: deepwiki-open:latest
    pull_policy: never
    ports:
      - 8001:8001
      - 3000:3000
    environment:
      - PORT=8001
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:8001
      - LOG_LEVEL=INFO
      - LOG_FILE_PATH=api/logs/application.log
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=https://api.openai.com/v1
    volumes:
      - ~/deepwiki/data:/root/.adalflow
    mem_limit: 4g
    mem_reservation: 2g
    networks:
      default:
        ipv4_address: 10.51.0.18
  digger:
    build:
      context: ../src/Digger
      dockerfile: ../../infra/digger/Dockerfile
    container_name: digger
    restart: unless-stopped
    environment:
      Logging__Level__Default: Warning
      Logging__Level__Microsoft: Warning
      Logging__LogLevel__Microsoft_Hosting_Lifetime: Warning
      Logging__LogLevel__Microsoft__EntityFrameworkCore__Database__Command: Warning
    depends_on:
      - transmission
    volumes:
      - /mnt/ssd/transmission/downloads/movies:/downloads/movies:rw
      - ~/digger:/digger/data:rw
    networks:
      default:
        ipv4_address: 10.51.0.2
  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:15
    restart: always
    volumes:
      - ~/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
        ipv4_address: 10.51.0.16
  frigate:
    container_name: frigate
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ~/frigate/config:/config
      - ~/frigate/media:/media/frigate
    networks:
      default:
        ipv4_address: 10.51.0.3
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_PASSWORD}
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ~/hermes/data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_DASHBOARD_TUI=1
    command: gateway run
    ports:
      - 8642:8642
      - 9119:9119
    networks:
      default:
        ipv4_address: 10.51.0.17
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 10.51.0.4
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    restart: unless-stopped
    volumes:
      - ~/jellyfin/config:/config
      - ~/jellyfin/cache:/cache
      - /mnt/ssd/transmission/downloads:/media
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_SERVER_URL}
    networks:
      default:
        ipv4_address: 10.51.0.5
  mosquitto:
    image: eclipse-mosquitto:openssl
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ~/mosquitto/data:/mosquitto/data
      - ~/mosquitto/config:/mosquitto/config
      - ~/mosquitto/log:/mosquitto/log
    networks:
      default:
        ipv4_address: 10.51.0.6
  n8n:
    user: 1000:1000
    image: docker.n8n.io/n8nio/n8n:next
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: "Europe/Lisbon"
      TZ: "Europe/Lisbon"
      N8N_HOST: n8n.mouras.me
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.mouras.me/
      WEBHOOK_URL: https://n8n.mouras.me/
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5678:5678
    volumes:
      - ~/n8n:/home/node/.n8n:rw
    networks:
      default:
        ipv4_address: 10.51.0.7
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - 443:443
      - 80:80
      - 81:81
    networks:
      default:
        ipv4_address: 10.51.0.8
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ~/ollama:/data    
    networks:
      default:
        ipv4_address: 192.168.1.19
    deploy:
      resources:
        reservations:
          memory: 8g
          cpus: '4.0'
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 10.51.0.11
    volumes:
      - ~/openwebui/data:/app/backend/data
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    networks:
      default:
        ipv4_address: 10.51.0.12
    volumes:
      - ~/pgadmin/servers.json:/pgadmin4/servers.json
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock
      - ~/portainer/data:/data
    networks:
      default:
        ipv4_address: 10.51.0.13
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:15
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks:
      default:
        ipv4_address: 10.51.0.14
    volumes:
      - ~/postgres/data:/var/lib/postgresql/data
  transmission:
    build:
      context: ./transmission
      dockerfile: Dockerfile
    container_name: transmission
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 10.51.0.15
    environment:
      TRANSMISSION_USER: ${TRANSMISSION_USER:-transmission}
      TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD}
    volumes:
      - /mnt/ssd/transmission/downloads:/downloads:rw
      - /mnt/ssd/transmission/incomplete:/incomplete:rw
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.51.0.0/24