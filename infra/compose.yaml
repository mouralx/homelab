services:
  digger:
    profiles:
      - media
    build:
      context: ../src/Digger
      dockerfile: ../../infra/Dockerfile.digger
    container_name: digger
    restart: unless-stopped
    environment:
      Logging__Level__Default: Warning
      Logging__Level__Microsoft: Warning
      Logging__LogLevel__Microsoft_Hosting_Lifetime: Warning
      Logging__LogLevel__Microsoft__EntityFrameworkCore__Database__Command: Warning
    depends_on:
      transmission:
        condition: service_healthy
    volumes:
      - ${DIGGER_HOST_MOVIES_DIR}:/downloads/movies:rw
      - ~/digger:/digger/data:rw
    networks:
      default:
        ipv4_address: 10.51.0.2

  llmster:
    profiles:
      - ai
    build:
      context: ..
      dockerfile: infra/Dockerfile.llmster
    container_name: llmster
    restart: unless-stopped
    environment:
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-e2b}
    volumes:
      - ~/llmster:/root/.lmstudio/models
    ports:
      - "4321:4321"
    networks:
      default:
        ipv4_address: 10.51.0.18
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4321/v1/models || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 120s

  vault:
    profiles:
      - tools
    container_name: vault
    entrypoint: /vault/config/entrypoint.sh
    image: hashicorp/vault:latest
    restart: unless-stopped
    volumes:
      - ~/vault/config:/vault/config
      - ~/vault/logs:/vault/logs
      - ~/vault/file:/vault/file
    ports:
      - "1234:1234"
    networks:
      default:
        ipv4_address: 10.51.0.6
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8200/v1/sys/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  hermes:
    profiles:
      - ai
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway
    ports:
      - "8642:8642"
      - "9119:9119"
    networks:
      default:
        ipv4_address: 10.51.0.17
    volumes:
      - ~/hermes:/opt/data
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY}"
      GATEWAY_ALLOWED_USERS: "${HERMES_ALLOWED_USERS}"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_OIDC_ISSUER: ${HERMES_DASHBOARD_OIDC_ISSUER}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: ${HERMES_DASHBOARD_OIDC_CLIENT_ID}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      OPENCODE_GO_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_API_KEY}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8642/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 10.51.0.4
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    restart: unless-stopped
    volumes:
      - ~/jellyfin/config:/config
      - ~/jellyfin/cache:/cache
      - ${JELLYFIN_MEDIA_DIR}:/media
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_SERVER_URL}
    networks:
      default:
        ipv4_address: 10.51.0.5
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8096/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  n8n:
    profiles:
      - tools
    image: docker.n8n.io/n8nio/n8n:next
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIME_ZONE}
      TZ: ${TIME_ZONE}
      N8N_HOST: ${N8N_HOST}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      WEBHOOK_URL: https://${N8N_HOST}/
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    volumes:
      - ~/n8n:/home/node/.n8n:rw
    networks:
      default:
        ipv4_address: 10.51.0.7
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - "443:443"
      - "80:80"
      - "81:81"
    networks:
      default:
        ipv4_address: 10.51.0.8
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  owui:
    profiles:
      - ai
    image: ghcr.io/open-webui/open-webui:main
    container_name: owui
    environment:
      ENABLE_EVALUATION_ARENA_MODELS: "false"
    ports:
      - "3003:8080"
    volumes:
      - ~/owui:/app/backend/data
    restart: always
    networks:
      default:
        ipv4_address: 10.51.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pgadmin:
    profiles:
      - tools
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    networks:
      default:
        ipv4_address: 10.51.0.12
    volumes:
      - ~/pgadmin/servers.json:/pgadmin4/servers.json
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/portainer/data:/data
    networks:
      default:
        ipv4_address: 10.51.0.13
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: pgvector/pgvector:pg15
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks:
      default:
        ipv4_address: 10.51.0.14
    volumes:
      - ~/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -q || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  honcho:
    profiles:
      - ai
    build:
      context: ..
      dockerfile: infra/Dockerfile.honcho
    container_name: honcho
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${OPENCODE_API_KEY}
      LLM_OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
      DERIVER_MODEL_CONFIG__MODEL: deepseek-v4-flash
      DERIVER_MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__LOW__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MAX__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__TRANSPORT: openai
      SUMMARY_MODEL_CONFIG__MODEL: deepseek-v4-flash
      SUMMARY_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__MODEL: text-embedding-nomic-embed-text-v1.5
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://10.51.0.18:4321/v1
      EMBEDDING_VECTOR_DIMENSIONS: "768"
      EMBEDDING_MAX_INPUT_TOKENS: "8192"
      LLM_DEFAULT_MAX_TOKENS: "4096"
      LLM_ANTHROPIC_API_KEY: ""
      LLM_ANTHROPIC_BASE_URL: ""
      LLM_GEMINI_API_KEY: ""
      HONCHO_MEMORY_LIMIT: ${HONCHO_MEMORY_LIMIT:-2G}
    ports:
      - "8000:8000"
    networks:
      default:
        ipv4_address: 10.51.0.19
    deploy:
      resources:
        limits:
          memory: ${HONCHO_MEMORY_LIMIT:-2G}
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  transmission:
    profiles:
      - media
    build:
      context: ..
      dockerfile: infra/Dockerfile.transmission
    container_name: transmission
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 10.51.0.15
    environment:
      TRANSMISSION_USER: ${TRANSMISSION_USERNAME}
      TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD}
    volumes:
      - ${TRANSMISSION_DOWNLOADS_DIR}:/downloads:rw
      - ${TRANSMISSION_INCOMPLETE_DIR}:/incomplete:rw
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9091/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  keycloak:
    profiles:
      - ai
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-false}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      default:
        ipv4_address: 10.51.0.16
    volumes:
      - ~/keycloak:/opt/keycloak/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.51.0.0/24
