services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway
    ports:
      - "8642:8642"
      - "9119:9119"
    networks:
      default:
        ipv4_address: 10.51.0.12
    volumes:
      - ~/hermes:/opt/data
    environment:
      GATEWAY_ALLOWED_USERS: "${HERMES_ALLOWED_USERS}"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_OIDC_ISSUER: ${HERMES_DASHBOARD_OIDC_ISSUER}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: ${HERMES_DASHBOARD_OIDC_CLIENT_ID}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      OPENCODE_GO_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_API_KEY}
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - "443:443"
      - "80:80"
      - "81:81"
    networks:
      default:
        ipv4_address: 10.51.0.13
  honcho:
    build:
      context: ..
      dockerfile: infra/dockerfile.honcho
    container_name: honcho
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${OPENCODE_API_KEY}
      LLM_OPENAI_BASE_URL: https://opencode.ai/zen/go/v1
      DERIVER_MODEL_CONFIG__MODEL: deepseek-v4-flash
      DERIVER_MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__LOW__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MAX__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL: deepseek-v4-flash
      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__TRANSPORT: openai
      SUMMARY_MODEL_CONFIG__MODEL: deepseek-v4-flash
      SUMMARY_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__MODEL: nomic-embed-text
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://ollama:11434/v1
      EMBEDDING_VECTOR_DIMENSIONS: "1536"
      EMBEDDING_MAX_INPUT_TOKENS: "8192"
      LLM_DEFAULT_MAX_TOKENS: "4096"
      LLM_ANTHROPIC_API_KEY: ""
      LLM_ANTHROPIC_BASE_URL: ""
      LLM_GEMINI_API_KEY: ""
      HONCHO_MEMORY_LIMIT: ${HONCHO_MEMORY_LIMIT:-2G}
    ports:
      - "8000:8000"
    networks:
      default:
        ipv4_address: 10.51.0.14
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ~/ollama:/root/.ollama
    networks:
      default:
        ipv4_address: 10.51.0.15
  lms:
    build:
      context: ..
      dockerfile: infra/dockerfile.lms
    container_name: lms
    restart: unless-stopped
    volumes:
      - ~/lms:/lms/.lmstudio
    networks:
      default:
        ipv4_address: 10.51.0.16
    ports:
      - "4321:4321"
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      default:
        ipv4_address: 10.51.0.17
    volumes:
      - keycloak:/opt/keycloak/data
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
  postgres:
    container_name: postgres
    restart: unless-stopped
    image: pgvector/pgvector:pg15
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks:
      default:
        ipv4_address: 10.51.0.18
    volumes:
      - ~/postgres/data:/var/lib/postgresql/data
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.51.0.0/24
volumes:
  keycloak: