name: lab
services:
  openclaw:
    networks:
      lab_net:
        ipv4_address: 10.203.0.10
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    hostname: openclaw
    restart: unless-stopped
    init: true
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789", --allow-unconfigured]
    ports:
      - 18789:18789
    volumes:
      - ~/openclaw:/home/node/.openclaw
      - ~/openclaw/auth-profile-secrets:/home/node/.config/openclaw
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      TZ: ${TIME_ZONE:-Europe/Lisbon}
  npm:
    networks:
      lab_net:
        ipv4_address: 10.203.0.12
    container_name: npm
    hostname: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - 8448:443
      - 8088:80
      - 8181:81
  n8n:
    networks:
      lab_net:
        ipv4_address: 10.203.0.20
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_HOST: https://n8n.mouras.me
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.mouras.me/webhook
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - ~/n8n/data:/home/node/.n8n
      - ~/n8n/files:/files
    ports:
      - 5678:5678
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    hostname: transmission
    networks:
      lab_net:
        ipv4_address: 10.203.0.21
    restart: unless-stopped
    environment:
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - ~/transmission/config:/config
      - /mnt/ssd/transmission/downloads:/downloads
      - ~/transmission/watch:/watch
    ports:
      - 9091:9091
      - ${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp
      - ${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    networks:
      lab_net:
        ipv4_address: 10.203.0.22
    volumes:
      - ~/jellyfin:/config
      - /mnt/ssd/transmission/downloads/complete:/data:rw
    ports:
      - 8096:8096
      - 7359:7359/udp
  portainer:
    networks:
      lab_net:
        ipv4_address: 10.203.0.23
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    volumes:
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
      - ~/portainer:/data
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
    ports:
      - 9000:9000
      - 9443:9443
  homeassistant:
    container_name: homeassistant
    hostname: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    networks:
      lab_net:
        ipv4_address: 10.203.0.25
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Europe/Lisbon
    ports:
      - 8123:8123
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    shm_size: 128mb
    labels:
      io.homelab.postgres.major: "${POSTGRES_MAJOR:-15}"
    networks:
      lab_net:
        ipv4_address: 10.203.0.17
    ports:
      - "${POSTGRES_BIND_HOST:-0.0.0.0}:5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Set the existing PostgreSQL administrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing PostgreSQL password}
    volumes:
      - ~/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  domus-databases:
    image: postgres:18-bookworm
    container_name: domus-databases
    restart: "no"
    command: [sh, /setup/init-databases.sh]
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      lab_net:
        ipv4_address: 10.203.0.37
    environment:
      PGHOST: ${DOMUS_POSTGRES_HOST:-postgres}
      PGPORT: ${DOMUS_POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:?Set the existing PostgreSQL administrator}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set the existing PostgreSQL password}
      DOMUS_MEMBERSHIP_DATABASE: ${DOMUS_MEMBERSHIP_DATABASE:-membership}
      DOMUS_BOARDS_DATABASE: ${DOMUS_BOARDS_DATABASE:-boards}
      DOMUS_AUTOMATIONS_DATABASE: ${DOMUS_AUTOMATIONS_DATABASE:-automations}
      DOMUS_AI_DATABASE: ${DOMUS_AI_DATABASE:-ai}
      DOMUS_MEMBERSHIP_DB_PASSWORD: ${DOMUS_MEMBERSHIP_DB_PASSWORD:?Set a dedicated membership password}
      DOMUS_BOARDS_DB_PASSWORD: ${DOMUS_BOARDS_DB_PASSWORD:?Set a dedicated boards password}
      DOMUS_AUTOMATIONS_DB_PASSWORD: ${DOMUS_AUTOMATIONS_DB_PASSWORD:?Set a dedicated automations password}
      DOMUS_AI_DB_PASSWORD: ${DOMUS_AI_DB_PASSWORD:?Set a dedicated AI password}
    volumes:
      - ./domus/init-databases.sh:/setup/init-databases.sh:ro
  domus-portal:
    image: ghcr.io/mouralx/domus-portal:${DOMUS_PORTAL_TAG:-stable}
    container_name: domus-portal
    hostname: domus-portal
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.30
      domus_net: {}
    depends_on:
      domus-membership: {condition: service_healthy}
      domus-boards: {condition: service_healthy}
      domus-automations: {condition: service_healthy}
      domus-ai: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      retries: 30
  domus-boards:
    image: ghcr.io/mouralx/domus-boards:${DOMUS_BOARDS_TAG:-stable}
    container_name: domus-boards
    hostname: domus-boards
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.32
      domus_net:
        aliases: [boards]
    environment: &domus-boards-environment
      ASPNETCORE_URLS: http://+:5180
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrationsOnStartup: "true"
      AllowedHosts: "${DOMUS_ALLOWED_HOSTS:-domus.mouras.me;localhost;127.0.0.1}"
      PortalOrigin: ${DOMUS_PUBLIC_URL:-https://domus.mouras.me}
      DOMUS_MEMBERSHIP_URL: http://domus-membership:5190
      DOMUS_IDENTITY_SYNC_SECRET: ${DOMUS_IDENTITY_SYNC_SECRET:?Set an internal identity signing secret}
      ConnectionStrings__Postgres: "Host=${DOMUS_POSTGRES_HOST:-postgres};Port=${DOMUS_POSTGRES_PORT:-5432};Database=${DOMUS_BOARDS_DATABASE:-boards};Username=domus_boards;Password=${DOMUS_BOARDS_DB_PASSWORD:?Set a dedicated boards password}"
      Platform__AdminEmails: ${DOMUS_PLATFORM_ADMIN_EMAILS-nuno.moura@outlook.com}
      Jira__AllowedHosts: ${DOMUS_JIRA_ALLOWED_HOSTS:-}
    volumes: [domus-work-keys:/app/.data-protection]
    depends_on:
      domus-databases: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, dotnet, Domus.Boards.Api.dll, --healthcheck]
      interval: 5s
      retries: 40
  domus-membership:
    image: ghcr.io/mouralx/domus-membership:${DOMUS_MEMBERSHIP_TAG:-stable}
    container_name: domus-membership
    hostname: domus-membership
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.31
      domus_net:
        aliases: [membership]
    environment:
      ASPNETCORE_URLS: http://+:5190
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "${DOMUS_ALLOWED_HOSTS:-domus.mouras.me;localhost;127.0.0.1}"
      PortalOrigin: ${DOMUS_PUBLIC_URL:-https://domus.mouras.me}
      Platform__AdminEmails: ${DOMUS_PLATFORM_ADMIN_EMAILS-nuno.moura@outlook.com}
      DOMUS_BOARDS_URL: http://domus-boards:5180
      DOMUS_IDENTITY_SYNC_SECRET: ${DOMUS_IDENTITY_SYNC_SECRET:?Set an internal identity signing secret}
      ConnectionStrings__Postgres: "Host=${DOMUS_POSTGRES_HOST:-postgres};Port=${DOMUS_POSTGRES_PORT:-5432};Database=${DOMUS_MEMBERSHIP_DATABASE:-membership};Username=domus_membership;Password=${DOMUS_MEMBERSHIP_DB_PASSWORD:?Set a dedicated membership password}"
    volumes: [domus-work-keys:/app/.data-protection]
    depends_on:
      domus-databases: {condition: service_completed_successfully}
      domus-boards: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Domus.Membership.Api.dll, --healthcheck]
      interval: 5s
      retries: 40
  domus-boards-worker:
    image: ghcr.io/mouralx/domus-boards-worker:${DOMUS_BOARDS_WORKER_TAG:-stable}
    container_name: domus-boards-worker
    hostname: domus-boards-worker
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.34
      domus_net: {}
    environment:
      <<: *domus-boards-environment
    volumes: [domus-work-keys:/app/.data-protection]
    depends_on:
      domus-boards: {condition: service_healthy}
  domus-automations:
    image: ghcr.io/mouralx/domus-automations:${DOMUS_AUTOMATIONS_TAG:-stable}
    container_name: domus-automations
    hostname: domus-automations
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.33
      domus_net:
        aliases: [automations]
    environment: &domus-automation-environment
      ASPNETCORE_URLS: http://+:4310
      AUTOMATIONS_DATA_DIR: /data
      DATABASE_HOST: ${DOMUS_POSTGRES_HOST:-postgres}
      DATABASE_PORT: ${DOMUS_POSTGRES_PORT:-5432}
      DATABASE_NAME: ${DOMUS_AUTOMATIONS_DATABASE:-automations}
      DATABASE_USER: domus_automations
      DATABASE_PASSWORD: ${DOMUS_AUTOMATIONS_DB_PASSWORD:?Set a dedicated automations password}
      RABBITMQ_HOST: domus-rabbitmq
      RABBITMQ_USER: domus
      RABBITMQ_PASSWORD: ${DOMUS_RABBITMQ_PASSWORD:?Set a dedicated RabbitMQ password}
      PORTAL_PUBLIC_URL: ${DOMUS_PUBLIC_URL:-https://domus.mouras.me}
      ENCRYPTION_KEY_DIR: /keys
      DOMUS_MEMBERSHIP_URL: http://domus-membership:5190
      DOMUS_WORK_API_URL: http://domus-boards:5180
    volumes: [domus-automation-data:/data, domus-automation-keys:/keys]
    depends_on:
      domus-databases: {condition: service_completed_successfully}
      domus-rabbitmq: {condition: service_healthy}
      domus-automations-worker: {condition: service_healthy}
      domus-boards: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Automations.Api.dll, --healthcheck]
      interval: 5s
      retries: 30
  domus-automations-worker:
    image: ghcr.io/mouralx/domus-automations-worker:${DOMUS_AUTOMATIONS_WORKER_TAG:-stable}
    container_name: domus-automations-worker
    hostname: domus-automations-worker
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.35
      domus_net: {}
    environment:
      <<: *domus-automation-environment
      ASPNETCORE_URLS: http://+:4320
      INSTALL_API_URL: http://domus-automations:4310
    volumes: [domus-automation-data:/data]
    depends_on:
      domus-databases: {condition: service_completed_successfully}
      domus-rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Automations.Worker.dll, --healthcheck]
      interval: 5s
      retries: 30
  domus-mcp-server:
    image: ghcr.io/mouralx/domus-mcp:${DOMUS_MCP_TAG:-stable}
    container_name: domus-mcp-server
    restart: unless-stopped
    networks:
      domus_net:
        aliases: [mcp-server]
    environment:
      ASPNETCORE_URLS: http://+:4340
      PORTAL_PUBLIC_URL: ${DOMUS_PUBLIC_URL:-https://domus.mouras.me}
      DOMUS_WORK_API_URL: http://domus-boards:5180
      DOMUS_MEMBERSHIP_URL: http://domus-membership:5190
      DOMUS_AUTOMATIONS_URL: http://domus-automations:4310
      DOMUS_AI_URL: http://domus-ai:4330
    depends_on:
      domus-boards: {condition: service_healthy}
      domus-membership: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Domus.Mcp.Server.dll, --healthcheck]
      interval: 5s
      retries: 30
  domus-ai:
    image: ghcr.io/mouralx/domus-ai:${DOMUS_AI_TAG:-stable}
    container_name: domus-ai
    restart: unless-stopped
    networks:
      lab_net: {}
      domus_net:
        aliases: [ai]
    environment:
      ASPNETCORE_URLS: http://+:4330
      AI_DATA_DIR: /data
      ConnectionStrings__Postgres: "Host=${DOMUS_POSTGRES_HOST:-postgres};Port=${DOMUS_POSTGRES_PORT:-5432};Database=${DOMUS_AI_DATABASE:-ai};Username=domus_ai;Password=${DOMUS_AI_DB_PASSWORD:?Set a dedicated AI password}"
      DOMUS_MCP_URL: http://domus-mcp-server:4340/mcp
      DOMUS_MEMBERSHIP_URL: http://domus-membership:5190
      DOMUS_WORK_API_URL: http://domus-boards:5180
      PORTAL_PUBLIC_URL: ${DOMUS_PUBLIC_URL:-https://domus.mouras.me}
      AI_OPENAI_OAUTH_MODE: "${DOMUS_AI_OPENAI_OAUTH_MODE:-}"
      AI_OPENAI_CLIENT_ID: "${DOMUS_AI_OPENAI_CLIENT_ID:-}"
      AI_OPENAI_CLIENT_SECRET: "${DOMUS_AI_OPENAI_CLIENT_SECRET:-}"
    volumes: [domus-ai-data:/data]
    depends_on:
      domus-databases: {condition: service_completed_successfully}
      domus-mcp-server: {condition: service_healthy}
      domus-membership: {condition: service_healthy}
      domus-boards: {condition: service_healthy}
    healthcheck:
      test: [CMD, dotnet, Domus.Ai.Api.dll, --healthcheck]
      interval: 5s
      retries: 30
  domus-rabbitmq:
    image: rabbitmq:4-management
    container_name: domus-rabbitmq
    hostname: domus-rabbitmq
    restart: unless-stopped
    networks: [domus_net]
    environment:
      RABBITMQ_DEFAULT_USER: domus
      RABBITMQ_DEFAULT_PASS: ${DOMUS_RABBITMQ_PASSWORD:?Set a dedicated RabbitMQ password}
    volumes:
      - domus-rabbitmq-data:/var/lib/rabbitmq
      - ./domus/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 5s
      start_period: 15s
      retries: 30

networks:
  lab_net:
    name: homelab_static
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.0.0/24
  domus_net:
    driver: bridge
volumes:
  domus-work-keys:
  domus-automation-data:
  domus-automation-keys:
  domus-rabbitmq-data:
  domus-ai-data:
