name: lab
x-tempo-api: &tempo-api
  image: ghcr.io/mouralx/tempo/api:${TEMPO_TAG:-stable}
  environment: &tempo-api-env
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Tempo: Host=tempo-postgres;Database=tempo;Username=tempo;Password=${TEMPO_APP_DB_PASSWORD:?Configure Tempo deployment secrets}
    Auth__Authority: ${TEMPO_IDENTITY_URL:-https://keycloak.mouras.me}/realms/tempo
    Auth__InternalBaseUrl: http://tempo-keycloak:8080
    Auth__Audience: tempo-api
  networks: [tempo_backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  gitea:
    networks:
      lab_net:
        ipv4_address: 10.203.0.30
    image: docker.gitea.com/gitea:28.2.0-rootless
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    volumes:
      - ~/gitea/data:/var/lib/gitea
      - ~/gitea/config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "3001:22"
  openclaw:
    networks:
      lab_net:
        ipv4_address: 10.203.0.10
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    hostname: openclaw
    restart: unless-stopped
    init: true
    command: [ node, dist/index.js, gateway, --bind, lan, --port, "18789", --allow-unconfigured ]
    ports:
      - 18789:18789
    volumes:
      - ~/openclaw:/home/node/.openclaw
      - ~/openclaw/auth-profile-secrets:/home/node/.config/openclaw
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      TZ: ${TIME_ZONE:-Europe/Lisbon}
  npm:
    networks:
      lab_net:
        ipv4_address: 10.203.0.12
    container_name: npm
    hostname: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - 8448:443
      - 8088:80
      - 8181:81
  n8n:
    networks:
      lab_net:
        ipv4_address: 10.203.0.20
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_HOST: https://n8n.mouras.me
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.mouras.me/webhook
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - ~/n8n/data:/home/node/.n8n
      - ~/n8n/files:/files
    ports:
      - 5678:5678
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    networks:
      lab_net:
        ipv4_address: 10.203.0.21
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      PUID: "0"
      PGID: "0"
      UMASK: "002"
    volumes:
      - ~/transmission/config:/config
      - ~/transmission/watch:/watch
      - /mnt/ssd/transmission/downloads:/downloads
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
  digger:
    user: "0:0"
    image: ghcr.io/mouralx/digger:${DIGGER_TAG:-stable}
    container_name: digger
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 10.203.0.24
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: ${TIME_ZONE:-Europe/Lisbon}
      DATABASE_URL: Data Source=/data/digger.db
      MOVIES_DIR: /downloads/complete/movies
      YTS_API_URL: "${DIGGER_YTS_API_URL:-https://movies-api.accel.li/api/v2/list_movies.json?quality=2160p&sort_by=year,rating,date_added&order_by=desc&limit=50&page={0}}"
      TRANSMISSION_RPC_URL: http://transmission:9091/transmission/rpc
      TRANSMISSION_USERNAME: ${DIGGER_TRANSMISSION_USERNAME:-${TRANSMISSION_USERNAME:-}}
      TRANSMISSION_PASSWORD: ${DIGGER_TRANSMISSION_PASSWORD:-${TRANSMISSION_PASSWORD:-}}
      MAX_LIBRARY_SIZE_GB: ${DIGGER_MAX_LIBRARY_SIZE_GB:-750}
      DISK_RESERVE_MB: ${DIGGER_DISK_RESERVE_MB:-51200}
    volumes:
      - ~/digger:/data
      - /mnt/ssd/transmission/downloads/complete/movies:/downloads/complete/movies
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    environment:
      TZ: ${TIME_ZONE:-Europe/Lisbon}
      PUID: "0"
      PGID: "0"
      UMASK: "002"
    networks:
      lab_net:
        ipv4_address: 10.203.0.22
    volumes:
      - ~/jellyfin:/config
      - /mnt/ssd/transmission/downloads/complete:/data:rw
    ports:
      - 8096:8096
      - 7359:7359/udp
  portainer:
    networks:
      lab_net:
        ipv4_address: 10.203.0.23
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    volumes:
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
      - ~/portainer:/data
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
    ports:
      - 9000:9000
      - 9443:9443
  homeassistant:
    container_name: homeassistant
    hostname: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    networks:
      lab_net:
        ipv4_address: 10.203.0.25
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Europe/Lisbon
    ports:
      - 8123:8123
  tempo-postgres:
    container_name: postgres
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TEMPO_POSTGRES_PASSWORD:?Configure Tempo deployment secrets}
      APP_DB_PASSWORD: ${TEMPO_APP_DB_PASSWORD:?Configure Tempo deployment secrets}
      IDENTITY_DB_PASSWORD: ${TEMPO_IDENTITY_DB_PASSWORD:?Configure Tempo deployment secrets}
    volumes:
      - tempo_postgres_data:/var/lib/postgresql/data
      - ./tempo/init.sh:/docker-entrypoint-initdb.d/10-tempo.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tempo_backend]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  tempo-keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    ports:
      - "8081:8080"
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://tempo-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${TEMPO_IDENTITY_DB_PASSWORD:?Configure Tempo deployment secrets}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TEMPO_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TEMPO_KEYCLOAK_ADMIN_PASSWORD:?Configure Tempo deployment secrets}
      KC_HOSTNAME: ${TEMPO_IDENTITY_URL:-https://keycloak.mouras.me}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 10.203.0.12/32
      TEMPO_PORTAL_URL: ${TEMPO_PORTAL_URL:-https://tempo.mouras.me}
    volumes: ['./tempo/tempo-realm.json:/opt/keycloak/data/import/tempo-realm.json:ro']
    depends_on: {tempo-postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\r\n\r\n\" >&3; cat <&3' | grep -q '200 OK'"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      tempo_backend: {}
      lab_net:
        ipv4_address: 10.203.0.27
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  tempo-migrate:
    container_name: tempo-migrate
    <<: *tempo-api
    command: [--migrate]
    restart: 'no'
    depends_on: {tempo-postgres: {condition: service_healthy}}
  tempo-api:
    container_name: tempo-api
    <<: *tempo-api
    ports:
      - "8082:8080"
    networks:
      tempo_backend:
        aliases: [api]
    restart: unless-stopped
    depends_on:
      tempo-migrate: {condition: service_completed_successfully}
      tempo-keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/Tempo.Api, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
  tempo-portal:
    container_name: tempo-portal
    image: ghcr.io/mouralx/tempo/portal:${TEMPO_TAG:-stable}
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      KEYCLOAK_PUBLIC_URL: ${TEMPO_IDENTITY_URL:-https://keycloak.mouras.me}
      PORTAL_PUBLIC_URL: ${TEMPO_PORTAL_URL:-https://tempo.mouras.me}
    depends_on: {tempo-api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      tempo_backend: {}
      lab_net:
        ipv4_address: 10.203.0.26
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:mode=1777", "/var/cache/nginx:uid=101,gid=101", "/var/run:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    mem_limit: 128m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  gitea-runner:
    image: docker.io/gitea/runner:${GITEA_RUNNER_TAG:-2}
    container_name: gitea-runner
    hostname: gitea-runner
    restart: unless-stopped
    stop_grace_period: 65s
    ports:
      - "127.0.0.1:8089:8088"
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL:-http://gitea:3000}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-beelink}
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://node:22-bookworm,homelab:docker://node:22-bookworm
    volumes:
      - gitea_runner_data:/data
      - ./gitea-runner/config.yaml:/config.yaml:ro
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
    networks:
      lab_net:
        ipv4_address: 10.203.0.31
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  tempo_postgres_data:
  gitea_runner_data:
    name: gitea-runner_gitea_runner_data
networks:
  tempo_backend:
    internal: true
  lab_net:
    name: homelab_static
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.0.0/24
