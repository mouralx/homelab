name: lab
services:
  openclaw:
    networks:
      lab_net:
        ipv4_address: 10.203.0.10
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    hostname: openclaw
    restart: unless-stopped
    init: true
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789", --allow-unconfigured]
    ports:
      - 18789:18789
    volumes:
      - ~/openclaw:/home/node/.openclaw
      - ~/openclaw/auth-profile-secrets:/home/node/.config/openclaw
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      TZ: ${TIME_ZONE:-Europe/Lisbon}
  npm:
    networks:
      lab_net:
        ipv4_address: 10.203.0.12
    container_name: npm
    hostname: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - 8448:443
      - 8088:80
      - 8181:81
  n8n:
    networks:
      lab_net:
        ipv4_address: 10.203.0.20
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_HOST: https://n8n.mouras.me
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.mouras.me/webhook
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - ~/n8n/data:/home/node/.n8n
      - ~/n8n/files:/files
    ports:
      - 5678:5678
  media-storage-init:
    image: alpine:3.23
    user: "0:0"
    restart: "no"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /downloads/complete/movies/.downloads
        chown -R 0:0 /downloads
        chmod -R u+rwX /downloads
    volumes:
      - /mnt/ssd/transmission/downloads:/downloads
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    networks:
      lab_net:
        ipv4_address: 10.203.0.21
    restart: unless-stopped
    depends_on:
      media-storage-init: {condition: service_completed_successfully}
    environment:
      TZ: Europe/Lisbon
      # Rootless Docker maps container 0:0 to the daemon host account.
      PUID: "0"
      PGID: "0"
      UMASK: "002"
    volumes:
      - ~/transmission/config:/config
      - ~/transmission/watch:/watch
      - /mnt/ssd/transmission/downloads:/downloads
      - /mnt/ssd/transmission/downloads/complete/movies:/movies
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
  digger:
    # Same mapped host owner as Transmission and Jellyfin.
    user: "0:0"
    image: ghcr.io/mouralx/digger:${DIGGER_TAG:-stable}
    container_name: digger
    restart: unless-stopped
    depends_on:
      media-storage-init: {condition: service_completed_successfully}
      transmission: {condition: service_started}
    networks:
      lab_net:
        ipv4_address: 10.203.0.24
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: ${TIME_ZONE:-Europe/Lisbon}
      DATABASE_URL: Data Source=/data/digger.db
      MOVIES_DIR: /movies
      YTS_API_URL: "${DIGGER_YTS_API_URL:-https://movies-api.accel.li/api/v2/list_movies.json?quality=2160p&sort_by=year,rating,date_added&order_by=desc&limit=50&page={0}}"
      TRANSMISSION_RPC_URL: http://transmission:9091/transmission/rpc
      TRANSMISSION_USERNAME: ${DIGGER_TRANSMISSION_USERNAME:-${TRANSMISSION_USERNAME:-}}
      TRANSMISSION_PASSWORD: ${DIGGER_TRANSMISSION_PASSWORD:-${TRANSMISSION_PASSWORD:-}}
      MAX_LIBRARY_SIZE_GB: ${DIGGER_MAX_LIBRARY_SIZE_GB:-750}
      DISK_RESERVE_MB: ${DIGGER_DISK_RESERVE_MB:-51200}
    volumes:
      - ~/digger:/data
      - /mnt/ssd/transmission/downloads/complete/movies:/movies
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    depends_on:
      media-storage-init: {condition: service_completed_successfully}
    environment:
      TZ: ${TIME_ZONE:-Europe/Lisbon}
      PUID: "0"
      PGID: "0"
      UMASK: "002"
    networks:
      lab_net:
        ipv4_address: 10.203.0.22
    volumes:
      - ~/jellyfin:/config
      - /mnt/ssd/transmission/downloads/complete:/data:rw
    ports:
      - 8096:8096
      - 7359:7359/udp
  portainer:
    networks:
      lab_net:
        ipv4_address: 10.203.0.23
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    volumes:
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
      - ~/portainer:/data
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
    ports:
      - 9000:9000
      - 9443:9443
  homeassistant:
    container_name: homeassistant
    hostname: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    networks:
      lab_net:
        ipv4_address: 10.203.0.25
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Europe/Lisbon
    ports:
      - 8123:8123
networks:
  lab_net:
    name: homelab_static
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.0.0/24
