name: lab
services:
  openclaw:
    profiles: [ai]
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    init: true
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789", --allow-unconfigured]
    ports:
      - 18789:18789
    volumes:
      - ~/openclaw:/home/node/.openclaw
      - ~/openclaw/auth-profile-secrets:/home/node/.config/openclaw
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      TZ: ${TIME_ZONE:-Europe/Lisbon}
  hermes:
    profiles: [ai]
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway
    ports:
      - 8642:8642
      - 9119:9119
    volumes:
      - ~/hermes:/opt/data
    environment:
      GATEWAY_ALLOWED_USERS: ${HERMES_ALLOWED_USERS}
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_OIDC_ISSUER: ${HERMES_DASHBOARD_OIDC_ISSUER}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: ${HERMES_DASHBOARD_OIDC_CLIENT_ID}
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      OPENCODE_GO_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_API_KEY}
  npm:
    profiles: [management]
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TIME_ZONE}
    volumes:
      - ~/npm/data:/data
      - ~/npm/certs:/etc/letsencrypt
    ports:
      - 443:443
      - 80:80
      - 81:81
  keycloak:
    profiles: [ai]
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak
    command: start-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ~/keycloak:/opt/keycloak/data
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0
  kanbada-api:
    profiles: [ai]
    image: ghcr.io/mouralx/kanbada-api:latest
    container_name: kanbada-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${KANBADA_ALLOWED_HOSTS:-kanbada.mouras.me}
      Database__ApplyMigrationsOnStartup: "true"
      PortalOrigin: ${KANBADA_PORTAL_ORIGIN:-https://kanbada.mouras.me}
      Jira__AllowedHosts: ${KANBADA_JIRA_ALLOWED_HOSTS:-}
      Platform__AdminEmails: ${KANBADA_PLATFORM_ADMIN_EMAILS:-}
      Authentication__Google__ClientId: ${KANBADA_GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${KANBADA_GOOGLE_CLIENT_SECRET:-}
      Authentication__Microsoft__ClientId: ${KANBADA_MICROSOFT_CLIENT_ID:-}
      Authentication__Microsoft__ClientSecret: ${KANBADA_MICROSOFT_CLIENT_SECRET:-}
      ConnectionStrings__Postgres: Host=postgres;Database=${KANBADA_POSTGRES_DB:-kanbada};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    volumes:
      - ~/kanbada/data-protection:/app/.data-protection
    ports:
      - ${KANBADA_API_PORT:-5180}:5180
  kanbada-portal:
    profiles: [ai]
    image: ghcr.io/mouralx/kanbada-portal:latest
    container_name: kanbada-portal
    restart: unless-stopped
    depends_on:
      kanbada-api:
        condition: service_started
    environment:
      API_PROXY_TARGET: http://kanbada-api:5180
    ports:
      - ${KANBADA_PORTAL_PORT:-4173}:4173
  kanbada-worker:
    profiles: [ai]
    image: ghcr.io/mouralx/kanbada-worker:latest
    container_name: kanbada-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kanbada-api:
        condition: service_started
    environment:
      Jira__AllowedHosts: ${KANBADA_JIRA_ALLOWED_HOSTS:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${KANBADA_POSTGRES_DB:-kanbada}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ~/kanbada/data-protection:/app/.data-protection
  postgres:
    profiles: [ai]
    container_name: postgres
    restart: unless-stopped
    image: pgvector/pgvector:pg15
    shm_size: 128mb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ~/postgres:/var/lib/postgresql/data
  portainer_agent:
    profiles: [ai, home]
    image: portainer/agent:2.39.6
    container_name: portainer_agent
    restart: always
    ports:
      - 9001:9001
    volumes:
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
      - ~/portainer_agent:/data
  prowlarr:
    profiles: [home]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: host
    restart: unless-stopped
    volumes:
      - ~/prowlarr:/config
  radarr:
    profiles: [home]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: host
    restart: unless-stopped
    volumes:
      - ~/radarr:/config
      - ~/transmission/downloads:/data
    depends_on:
      prowlarr:
        condition: service_started
      transmission:
        condition: service_started
  n8n:
    profiles: [ai]
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_HOST: https://n8n.mouras.me
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://n8n.mouras.me/webhook
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    volumes:
      - ~/n8n/data:/home/node/.n8n
      - ~/n8n/files:/files
    ports:
      - 5678:5678
  transmission:
    profiles: [home]
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: host
    restart: unless-stopped
    environment:
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - ~/transmission/config:/config
      - ~/transmission/downloads:/downloads
      - ~/transmission/watch:/watch
  jellyfin:
    profiles: [home]
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    # Bypass the rpi5 Docker bridge egress fault for metadata providers.
    # Host networking binds Jellyfin's ports directly; do not add ports here.
    network_mode: host
    volumes:
      - ~/jellyfin:/config
      - ~/transmission/downloads/complete:/data:ro
  portainer:
    profiles: [management]
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /run/user/${USER_ID:-1000}/docker.sock:/var/run/docker.sock
      - ~/portainer:/data
    environment:
      - PORTAINER_MANAGE_EXTERNAL_STACKS=1
    ports:
      - 9000:9000
      - 9443:9443
  pgadmin:
    profiles: [ai]
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ~/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - 4431:443
      - 8001:80
  homeassistant:
    profiles: [home]
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Lisbon
