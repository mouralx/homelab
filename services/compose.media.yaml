name: media-services
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    volumes:
      - prowlarr:/config
    ports:
      - 9696:9696
    depends_on:
      - transmission
    networks:
      shared:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - sonarr:/config
      - data:/downloads
    ports:
      - 8989:8989
    depends_on:
      - prowlarr
    networks:
      shared:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    volumes:
      - radarr:/config
      - data:/downloads
    ports:
      - 7878:7878
    depends_on:
      - prowlarr
    networks:
      shared:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - transmission:/config
      - data:/downloads
      - watch:/watch
    ports:
      - 9091:9091
      - 51413:51413/udp
      - 51413:51413/tcp
    networks:
      shared:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    volumes:
      - jellyfin:/config
      - data:/data:ro
    ports:
      - 8096:8096
      - 7359:7359/udp
    networks:
      shared:
networks:
  shared:
    external: true
volumes:
  prowlarr:
  radarr:
  sonarr:
  jellyfin:
  transmission:
  data:
  watch:
