name: media
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    volumes:
      - ~/media/prowlarr:/config
    ports:
      - 9696:9696
    depends_on:
      - transmission
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - ~/media/sonarr:/config
      - ~/media/data:/downloads
    ports:
      - 8989:8989
    depends_on:
      - prowlarr
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    volumes:
      - ~/media/radarr:/config
      - ~/media/data:/downloads
    ports:
      - 7878:7878
    depends_on:
      - prowlarr
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - ~/media/transmission:/config
      - ~/media/data:/downloads
      - ~/media/watch:/watch
    ports:
      - 9091:9091
      - 51413:51413/udp
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ~/media/jellyfin:/config
      - ~/media/data:/data:ro
    ports:
      - 8096:8096
      - 7359:7359/udp