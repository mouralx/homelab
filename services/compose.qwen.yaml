# Opt-in trial: layer after services/compose.yaml. Other services are unchanged.
services:
  honcho:
    environment:
      # Process short chat batches promptly instead of waiting up to 30 minutes.
      DERIVER_REPRESENTATION_BATCH_MAX_AGE_SECONDS: "60"
      LLM_OPENAI_API_KEY: local-lms
      LLM_OPENAI_BASE_URL: http://lms:4321/v1
      DERIVER_MODEL_CONFIG__TRANSPORT: openai
      DERIVER_MODEL_CONFIG__MODEL: ${HONCHO_LOCAL_MODEL:-qwen3-1.7b}
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: http://lms:4321/v1
      DERIVER_MODEL_CONFIG__OVERRIDES__PROVIDER_PARAMS: '{"extra_body":{"reasoning_effort":"none"}}'
      DERIVER_MODEL_CONFIG__STRUCTURED_OUTPUT_MODE: json_schema
      SUMMARY_MODEL_CONFIG__TRANSPORT: openai
      SUMMARY_MODEL_CONFIG__MODEL: ${HONCHO_LOCAL_MODEL:-qwen3-1.7b}
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: http://lms:4321/v1
      SUMMARY_MODEL_CONFIG__OVERRIDES__PROVIDER_PARAMS: '{"extra_body":{"reasoning_effort":"none"}}'
