      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL: ${HONCHO_LOCAL_MODEL:-qwen3-1.7b}
      DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__OVERRIDES__BASE_URL: http://lms:4321/v1
