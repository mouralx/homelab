log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 60s
  insecure: false
cache:
  enabled: true
  dir: /data/cache
  host: 10.203.0.31
  port: 8088
container:
  network: homelab_static
  privileged: false
  # Create job containers through the host daemon, without automatically
  # exposing the Docker socket inside each job.
  docker_host: '-'
  valid_volumes: []
